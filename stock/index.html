<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock por tienda</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#F5F3EE;--card:#FFFFFF;--ink:#14213D;--mut:#6A7179;--line:#E2DED5;--acc:#C2410C;--zero:#B9B4AA;--hl:#FDE7CF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--card:#18223A;--ink:#EEF1F6;--mut:#9AA8BF;--line:#2A3654;--acc:#D97706;--zero:#4A5672;--hl:#3A2A12}}
:root[data-theme="dark"]{--bg:#0F1626;--card:#18223A;--ink:#EEF1F6;--mut:#9AA8BF;--line:#2A3654;--acc:#D97706;--zero:#4A5672;--hl:#3A2A12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:4px 16px 40px}
.bar{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:10px 0 6px;z-index:2}
#q{flex:1;min-width:0;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
#q:focus{border-color:var(--acc)}
.btn{border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;padding:0 14px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn svg{width:22px;height:22px}
.meta{font-size:12px;color:var(--mut);margin:2px 2px 10px}
.msg{padding:14px;color:var(--mut);text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.cod{font-weight:700;font-size:20px}
.desc{color:var(--mut);margin:2px 0 8px}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.tot b{font-size:26px}
.grp{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:12px 0 4px}
.row{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line);font-size:17px}
.row:last-child{border-bottom:0}
.row .n{font-weight:700;font-variant-numeric:tabular-nums}
.row.z{color:var(--zero)}
.row.me{background:var(--hl);border-radius:8px;padding:7px 8px}
.it{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;color:var(--ink);font:inherit;cursor:pointer}
.it small{color:var(--mut)}
.rec{display:flex;flex-wrap:wrap;gap:6px}
.rec button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 11px;font:inherit;font-size:14px;cursor:pointer}
select{font:inherit;font-size:13px;padding:3px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.cam{position:fixed;inset:0;background:#000;z-index:10;display:none;flex-direction:column}
.cam.on{display:flex}
.cam video{flex:1;width:100%;object-fit:cover;min-height:0}
.cam .guide{position:absolute;left:8%;right:8%;top:40%;height:20%;border:3px solid #F59E0B;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.cam .ctl{position:absolute;left:0;right:0;bottom:0;padding:16px;display:flex;gap:10px;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.cam .ctl button,.cam .ctl label{font:inherit;font-size:16px;font-weight:600;border:0;border-radius:12px;padding:12px 18px;background:#fff;color:#14213D;cursor:pointer}
.cam .st{position:absolute;top:16px;left:0;right:0;text-align:center;color:#fff;font-size:15px;text-shadow:0 1px 3px #000}
.btn2{border:2px solid var(--acc);border-radius:12px;background:transparent;color:var(--acc);font-size:15px;font-weight:600;padding:0 12px;display:flex;align-items:center;cursor:pointer}
</style></head><body>
<div class="w">
 <div class="bar">
  <input id="q" inputmode="search" autocomplete="off" autocapitalize="characters" placeholder="Código, barras o nombre" autofocus>
  <button class="btn" id="camb" title="Escanear con la cámara"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>Escanear</button>
 </div>
 <div class="meta" id="meta"></div>
 <div class="cam" id="cam"><video id="vid" playsinline muted autoplay></video><div class="guide"></div><div class="st" id="camst">Apunta al código de barras</div>
 <div class="ctl"><label>Foto<input id="foto" type="file" accept="image/*" capture="environment" hidden></label><button id="camx">Cerrar</button></div></div>
 <div id="out"></div>
</div>
<script src="data.enc.js"></script>
<script>
const T=["Mall del Sol","Urdesa","Samborondón","Condado","El Jardín","Portal","Scala","Megakywi","Megamaxi","Tumbaco","CEDIS Quito","CEDIS Guayaquil"];
const GYE=[0,1,2],UIO=[3,4,5,6,7,8,9],CED=[10,11],TIE=[...UIO,...GYE];
let D=[],F="";
const byCode=new Map(),byBar=new Map();
async function cargar(){
 let k=new URLSearchParams(location.hash.slice(1)).get("k");
 try{if(k)localStorage.setItem("st.k",k);else k=localStorage.getItem("st.k")}catch(e){}
 if(!k)throw new Error("sin clave");
 const b64=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"==".slice(0,(4-s.length%4)%4)),c=>c.charCodeAt(0));
 const key=await crypto.subtle.importKey("raw",b64(k),"AES-GCM",false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct));
 const w={};new Function("window",new TextDecoder().decode(pt))(w);
 D=w.STOCK_DATA;F=w.STOCK_FECHA;
 for(const p of D){byCode.set(p[0].toUpperCase(),p);for(const b of p[2].split(" "))if(b)byBar.set(b,p)}}
const $=s=>document.querySelector(s),q=$("#q"),out=$("#out");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase();
let mi=-1,rec=[],cur=null;
try{mi=+(localStorage.getItem("st.tienda")??-1);rec=JSON.parse(localStorage.getItem("st.rec")||"[]")}catch(e){}
function meta(){
 $("#meta").innerHTML=`Stock del ERP · ${esc(F)} · Mi tienda: <select id="mi"><option value="-1">—</option>${T.slice(0,10).map((t,i)=>`<option value="${i}"${i==mi?" selected":""}>${t}</option>`).join("")}</select>`;
 $("#mi").onchange=e=>{mi=+e.target.value;try{localStorage.setItem("st.tienda",mi)}catch(_){}if(cur)show(cur);q.focus()}}
function bind(){out.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const p=byCode.get(b.dataset.c);q.value=p[0];show(p);q.focus()})}
const sum=(ix,p)=>ix.reduce((a,i)=>a+Math.max(0,p[4+i]),0);
function rows(ix,p){
 const o=[...ix].sort((a,b)=>(b==mi)-(a==mi)||p[4+b]-p[4+a]);
 return o.map(i=>{const n=p[4+i];return `<div class="row${n<=0?" z":""}${i==mi?" me":""}"><span>${T[i]}</span><span class="n">${n}</span></div>`}).join("")}
function recent(){const r=rec.filter(c=>byCode.has(c)&&(!cur||c!==cur[0]));return r.length?`<div class="grp">Recientes</div><div class="rec">${r.map(c=>`<button data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>`:""}
function show(p){cur=p;
 rec=[p[0],...rec.filter(c=>c!==p[0])].slice(0,8);try{localStorage.setItem("st.rec",JSON.stringify(rec))}catch(e){}
 out.innerHTML=`<div class="card"><div class="cod">${esc(p[0])}</div><div class="desc">${esc(p[1])}${p[3]?` · $${p[3].toFixed(2)} con IVA`:""}</div>
 <div class="tot"><span>Total en tiendas</span><b>${sum(TIE,p)}</b></div>
 <div class="grp">Quito · ${sum(UIO,p)}</div>${rows(UIO,p)}
 <div class="grp">Guayaquil · ${sum(GYE,p)}</div>${rows(GYE,p)}
 <div class="grp">CEDIS · ${sum(CED,p)}</div>${rows(CED,p)}
 <div class="desc" style="margin-top:8px;font-size:12px">Barras: ${esc(p[2]||"—")}</div></div>`+recent();
 bind()}
function find(raw,enter){
 const s=raw.trim();
 if(!s){cur=null;out.innerHTML=recent();bind();return}
 const u=s.toUpperCase(),d=s.replace(/\D/g,"");
 const p=byCode.get(u)||(d.length>=6&&d===s?(byBar.get(d)||byBar.get(d.replace(/^0+/,""))||byBar.get("0"+d)):null);
 if(p){show(p);if(enter)q.select();return}
 const k=norm(s).split(/\s+/),hits=[];
 for(const x of D){const h=norm(x[0]+" "+x[1]+" "+x[2]);if(k.every(w=>h.includes(w))){hits.push(x);if(hits.length>=30)break}}
 if(hits.length===1&&enter){show(hits[0]);q.select();return}
 cur=null;
 out.innerHTML=hits.length?hits.map(x=>`<button class="it" data-c="${esc(x[0])}"><b>${esc(x[0])}</b> · ${sum(TIE,x)} en tiendas<br><small>${esc(x[1])}</small></button>`).join(""):`<div class="msg">No encontré “${esc(s)}”.</div>`;
 bind()}
let tm;
q.addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(()=>find(q.value,false),120)});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();clearTimeout(tm);find(q.value,true)}});
q.addEventListener("focus",()=>q.select());
// Foto del código de barras
let zx=null;
const loadScript=src=>new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
async function zxing(){
 if(zx)return zx;
 await loadScript("zxwasm.js");await loadScript("zx.js");
 const b=Uint8Array.from(atob(window.ZX_WASM),c=>c.charCodeAt(0));
 await ZXingWASM.prepareZXingModule({overrides:{wasmBinary:b.buffer},fireImmediately:true});
 zx=ZXingWASM;return zx}
async function leer(file){
 if("BarcodeDetector" in window){try{const r=await new BarcodeDetector().detect(await createImageBitmap(file));if(r.length)return r[0].rawValue}catch(e){}}
 const z=await zxing();
 const r=await z.readBarcodes(file,{tryHarder:true,formats:["Linear-Codes","QRCode"],maxNumberOfSymbols:1});
 return r.length?r[0].text:null}
$("#foto").onchange=async e=>{
 const f=e.target.files[0];e.target.value="";if(!f)return;cerrarCam();
 out.innerHTML=`<div class="msg">Leyendo el código…</div>`;
 try{const c=await leer(f);
  if(c){q.value=c;find(c,true)}else out.innerHTML=`<div class="msg">No se leyó el código. Toma la foto más cerca o escríbelo.</div>`}
 catch(err){out.innerHTML=`<div class="msg">No se pudo leer la foto. Escribe el código.</div>`}};
cargar().then(()=>{meta();find("",false)}).catch(()=>{out.innerHTML=`<div class="msg">Abre la app con el enlace completo que te mandaron.</div>`});
// Cámara en vivo
const cam=$("#cam"),vid=$("#vid"),cst=$("#camst");let stream=null,scanOn=false,nd=null;
const FMT=["EAN-13","EAN-8","UPC-A","UPC-E","Code128","Code39","ITF"];
async function abrirCam(){
 cam.classList.add("on");cst.textContent="Abriendo la cámara…";
 try{
  if(!stream)stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
  vid.srcObject=stream;await vid.play();
 }catch(e){cst.textContent="No se pudo abrir la cámara. Usa Foto o escribe el código.";return}
 if("BarcodeDetector" in window){try{const f=await BarcodeDetector.getSupportedFormats();nd=new BarcodeDetector({formats:f.filter(x=>/ean|upc|code_128|code_39|itf/.test(x))})}catch(e){nd=null}}
 if(!nd){cst.textContent="Preparando el lector…";try{await zxing()}catch(e){cst.textContent="No cargó el lector. Usa Foto.";return}}
 cst.textContent="Apunta al código de barras";scanOn=true;loop()}
const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
async function loop(){
 if(!scanOn)return;
 try{
  const w=vid.videoWidth,h=vid.videoHeight;
  if(w){let c=null;
   if(nd){const r=await nd.detect(vid);if(r.length)c=r[0].rawValue}
   else{const sw=w,sh=Math.round(h*0.5);cv.width=sw;cv.height=sh;cx.drawImage(vid,0,(h-sh)/2,sw,sh,0,0,sw,sh);
    const r=await zx.readBarcodes(cx.getImageData(0,0,sw,sh),{formats:FMT,tryHarder:true,maxNumberOfSymbols:1});if(r.length)c=r[0].text}
   if(c){try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}cerrarCam();q.value=c;find(c,true);return}}
 }catch(e){}
 setTimeout(loop,nd?120:60)}
function cerrarCam(){scanOn=false;cam.classList.remove("on");if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
$("#camb").onclick=abrirCam;$("#camx").onclick=()=>{cerrarCam();q.focus()};
addEventListener("pagehide",cerrarCam);
</script>
</body></html>
